name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Rust para Windows
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar o executavel em modo Release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Criar o Instalador com Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Disponibilizar Instalador para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Instalador_NX_NEXTECH_Windows
          path: dist/*.exe
