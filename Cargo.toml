[package]
name = "nextech"
version = "0.1.0"
edition = "2024"
description = "Windows desktop POS, Inventory, and Financial Control system for mobile phone and electronics repair shops"
license = "MIT"

[dependencies]
egui = "0.29"
eframe = "0.29"
egui_extras = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
anyhow = "1.0"
log = "0.4"
csv = "1.3"
rfd = "0.15"
egui-toast = "0.15"
dirs = "6"
open = "5"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
